name: redpanda-tiered-storage-realistic-workload

# OMB driver-redpanda client config for the realistic mixed workload.
# See ../docs/03-run-realistic-workload.md for how to run this.
#
# Fill in your own connection details below. If your cluster uses
# TLS/mTLS/SASL, add the matching client.* properties to commonConfig,
# producerConfig, and consumerConfig (see the OMB driver-kafka docs for the
# full list of supported client properties).

driverClass: io.openmessaging.benchmark.driver.redpanda.RedpandaBenchmarkDriver

replicationFactor: 3
reset: true

topicConfig: |
  # Requires cluster property default_redpanda_storage_mode=tiered, OR
  # uncomment the line below for an explicit per-topic override (26.1+):
  # redpanda.storage.mode=tiered
  #
  # Pre-26.1 clusters: use the legacy pair instead:
  # redpanda.remote.write=true
  # redpanda.remote.read=true
  min.insync.replicas=2
  #
  # Unlike driver-read-path.yaml, do NOT set an artificially small
  # retention.local.target.bytes/.ms here - this workload is meant to be
  # representative, so local retention should match what you actually
  # plan to run in production. Set it to your real target below, or leave
  # it unset to inherit the cluster's retention_local_target_*_default.
  # retention.local.target.bytes=REPLACE_ME
  # retention.local.target.ms=REPLACE_ME

commonConfig: |
  bootstrap.servers=REPLACE_ME:9092
  # security.protocol=SASL_SSL
  # sasl.mechanism=SCRAM-SHA-256
  # sasl.jaas.config=REPLACE_ME

producerConfig: |
  acks=all
  linger.ms=5
  batch.size=131072
  compression.type=none

consumerConfig: |
  group.id=benchGroup
  auto.offset.reset=latest
  enable.auto.commit=false
  auto.commit.interval.ms=0
  max.partition.fetch.bytes=1048576
